services:
  - type: web
    name: tumarana-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 -b 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "https://tumara-a.vercel.app"
      - key: APP_BASE_URL
        value: "https://tumara-a.vercel.app"
      - key: ACTION_TOKEN_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: FORCE_HTTPS
        value: "true"
