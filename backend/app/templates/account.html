{% extends 'base.html' %}{% block title %}Cuenta — TuMaraña.com{% endblock %}{% block content %}
<section class="account"><div><span class="kicker">TU CUENTA</span><h1>Entra a TuMaraña.com</h1><p>Accede para solicitar servicios, administrar tus solicitudes o registrar tu actividad profesional.</p></div><div class="form-card"><div class="tabs"><button type="button" class="active" data-tab="login">Ingresar</button><button type="button" data-tab="signup">Crear cuenta</button></div>
<form id="login-form"><label>Email<input type="email" id="login-email" autocomplete="email" required></label><label>Contraseña<input type="password" id="login-password" autocomplete="current-password" required minlength="8"></label><button class="btn primary" type="submit">Ingresar</button></form>
<form id="signup-form" hidden><label>Nombre<input id="signup-name" autocomplete="name" required maxlength="150"></label><label>Email<input type="email" id="signup-email" autocomplete="email" required></label><label>Contraseña<input type="password" id="signup-password" autocomplete="new-password" required minlength="8"></label><button class="btn primary" type="submit">Crear cuenta</button></form><button id="logout-btn" class="btn outline" type="button" hidden>Cerrar sesión</button><div id="auth-msg" class="msg"></div></div></section>{% endblock %}
