<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('main.static',filename='images/favicon-32.png') }}">
<link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('main.static',filename='images/favicon-192.png') }}">
<meta name="SUPABASE_URL" content="{{ config.SUPABASE_URL }}"><meta name="SUPABASE_ANON_KEY" content="{{ config.SUPABASE_ANON_KEY }}">
<meta name="description" content="TuMaraña.com — conectamos necesidades con habilidades.">
<title>{% block title %}TuMaraña.com{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('main.static',filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="{{ url_for('main.static',filename='js/app.js') }}"></script>
</head>
<body>
<header class="nav tm-nav">
  <a class="brand" href="{{ url_for('main.index') }}"><img src="{{ url_for('main.static',filename='images/logo-tumarana.png') }}" alt="TuMaraña.com"></a>
  <nav><a href="{{ url_for('main.index') }}">Inicio</a><a href="{{ url_for('main.search') }}">Buscar servicios</a><a href="{{ url_for('main.index') }}#como-funciona">Cómo funciona</a></nav>
  <div class="nav-actions"><a href="{{ url_for('main.account') }}">Ingresar</a><a class="btn primary" href="{{ url_for('main.register') }}">Ofrecer un servicio</a></div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer><div class="footer-inner"><img src="{{ url_for('main.static',filename='images/logo-tumarana.png') }}" alt="TuMaraña.com"><p>Conectamos necesidades con habilidades.</p><span>© 2026 TuMaraña.com</span></div></footer>
</body></html>
